# Perfil de desarrollo (dev)
spring.profiles.active=dev

spring.application.name=api-dresscode

# Configuración de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/dresscode_database
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Si querés controlar la zona horaria del servidor (opcional)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuración para desactivar la seguridad (para el perfil de desarrollo)
# Esto permite el acceso sin autenticación a los endpoints
# Solo debería aplicarse en el perfil "dev"
spring.security.enabled=false

jwt.secret=${JWT_SECRET}
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}

logging.level.org.springframework.security=DEBUG
logging.level.com.dresscode.api_dresscode.Jwt=DEBUG

# Logging personalizado
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.dresscode=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator avanzado
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator