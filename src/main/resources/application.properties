# Perfil de desarrollo (dev)
spring.profiles.active=dev

spring.application.name=api-dresscode

# Configuración de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/dresscode_database
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Si querés controlar la zona horaria del servidor (opcional)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuración para desactivar la seguridad (para el perfil de desarrollo)
# Esto permite el acceso sin autenticación a los endpoints
# Solo debería aplicarse en el perfil "dev"
# spring.security.enabled is not a recognized Spring Boot property — commented out to avoid confusion
# spring.security.enabled=false

jwt.secret=${JWT_SECRET}

# Mail (SendGrid SMTP)
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@dresscode.com}
app.mail.from-name=DressCode

mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}

# CORS — allowed origins must be explicit, never wildcard
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# URL del frontend — usada como back_url en MercadoPago
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# URL pública del backend — usada como notificationUrl en MercadoPago
app.backend-url=${BACKEND_URL:http://localhost:8080}

logging.level.org.springframework.security=DEBUG
logging.level.com.dresscode.api_dresscode.Jwt=DEBUG

# Logging personalizado
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.dresscode=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Multipart (subida de archivos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cache para métricas y endpoints que se consultan frecuentemente
spring.cache.type=simple
spring.cache.cache-names=estadisticasDashboard
spring.cache.simple.maximum-size=200
spring.cache.simple.expire-after-write=30s

# Configuración de recursos estáticos
spring.web.resources.static-locations=classpath:/static/,file:public/
spring.web.resources.add-mappings=true

# Configuración de subida de archivos
file.upload.dir=public/assets/banners/

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator avanzado
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator