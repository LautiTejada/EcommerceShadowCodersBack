# Perfil de desarrollo
spring.datasource.url=jdbc:postgresql://localhost:5432/dresscode_database
spring.datasource.username=postgres
spring.jpa.show-sql=true
spring.security.enabled=false
spring.datasource.password=${DB_PASSWORD:postgres}
jwt.secret=${JWT_SECRET:dev-secret-key-at-least-32-chars-long!!}
mercadopago.access-token=${MP_ACCESS_TOKEN:TEST-placeholder}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
logging.level.org.springframework.security=DEBUG
logging.level.com.dresscode.api_dresscode.Jwt=DEBUG

# CORS — dev allows localhost frontend
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Webhook HMAC secret (dev placeholder)
webhook.hmac-secret=${WEBHOOK_HMAC_SECRET:dev-only-secret}

# Configuración de recursos estáticos
spring.web.resources.static-locations=classpath:/static/,file:public/
spring.web.resources.add-mappings=true

# Configuración de subida de archivos
file.upload.dir=public/assets/banners/
