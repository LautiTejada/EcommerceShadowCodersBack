# Perfil de producción
spring.datasource.url=jdbc:postgresql://prod-db-server:5432/dresscode_database
spring.datasource.username=prod_user
spring.datasource.password=prod_password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.security.enabled=true
jwt.secret=${JWT_SECRET}
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}
logging.level.org.springframework.security=WARN
logging.level.com.dresscode.api_dresscode.Jwt=WARN

# CORS — production must use explicit origins via env var
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
