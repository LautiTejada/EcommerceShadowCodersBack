# Perfil de test — in-memory H2, no external DB required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-for-testing-only-do-not-use-in-production-must-be-at-least-32-chars
mercadopago.access-token=TEST_ACCESS_TOKEN
mercadopago.webhook-secret=test-hmac-secret-for-tests
logging.level.org.springframework.security=ERROR
logging.level.com.dresscode.api_dresscode.Jwt=ERROR

# CORS — test profile uses a known allowed origin
cors.allowed-origins=http://localhost:5173

# Hibernate statistics — enabled in test profile only for N+1 validation
spring.jpa.properties.hibernate.generate_statistics=true
